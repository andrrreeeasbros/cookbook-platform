<!DOCTYPE html>
{% load static %}
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta name="description" content="Описание вашего сайта">
  <meta name="keywords" content="ключевые, слова, вашего, сайта">
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/line/contacts.css' %}" rel="stylesheet">
  <style>
    body.index-page {
      background-image: url("{% static 'img/1.jpg' %}");
      background-color: rgba(0, 0, 0, 0.5); /* Прозрачный черный фон */
      background-size: cover;               /* Фон заполняет весь экран, сохраняя пропорции */
      background-position: center;          /* Центрируем изображение */
      background-repeat: no-repeat;         /* Не повторять изображение */
      background-attachment: fixed;         /* Фон фиксирован при прокрутке */
      height: 100vh;                        /* Занимает всю высоту экрана */
      font-family: var(--default-font);
    }

  </style>
</head>

<body class="index-page">
  <a href="{% url 'RecipeHub:main_template' %}" class="back-button">Вернуться назад</a>
    <div class="container d-flex flex-column align-items-center">
      <a href="" class="logo">
        <h1 class="sitename">Связаться с разработчиком</h1>
      </a>
      <nav id="navmenu" class="navmenu">
      </nav>
      <div class="image-container">
      </div>
    </div>
  </header>

  <!-- Контактная форма с овальным фоном -->
  <section class="contact-form-section">
    <div class="container d-flex justify-content-center">
      <div class="contact-form-container">
        <h2>Связаться с разработчиком</h2>
        <p>Оставьте ваше сообщение или контактные данные, и я свяжусь с вами.</p>
        <form action="#" method="POST">
          <div class="form-group">
            <input type="text" class="form-control" placeholder="Ваше имя" required>
          </div>
          <div class="form-group">
            <input type="email" class="form-control" placeholder="Ваш email" required>
          </div>
          <div class="form-group">
            <textarea class="form-control" rows="4" placeholder="Ваше сообщение" required></textarea>
          </div>
          <button type="submit">Отправить сообщение</button>
        </form>
      </div>
    </div>
  </section>

  <div class="logo-bar">
    <div class="left-section">
      <a href="{% url 'RecipeHub:main_template' %}">
        <img src="{% static 'img/logo.png' %}" alt="Логотип">
    </a>
      <a href="{% url 'RecipeHub:contacts' %}" class="team-contact">Связь с командой</a>
      <a href="https://t.me/yourbot" target="_blank" class="team-contact">Напишите нам в Telegram</a>
    </div>
    <div class="social-icons">
      <a href="https://facebook.com" target="_blank">
        <img src="{% static 'img/facebook.svg' %}" alt="Facebook">
      </a>
      <a href="https://instagram.com" target="_blank">
        <img src="{% static 'img/instagram.svg' %}" alt="Instagram">
      </a>
      <a href="https://vk.com" target="_blank">
        <img src="{% static 'img/VK.svg' %}" alt="ВКонтакте">
      </a>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
