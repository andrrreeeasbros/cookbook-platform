<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta name="description" content="Описание вашего сайта">
  <meta name="keywords" content="ключевые, слова, вашего, сайта">
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lora&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <link href="{% static 'css/menu/profile.css' %}" rel="stylesheet">
  <link href="{% static 'css/menu/style.css' %}" rel="stylesheet">
</head>
<body class="index-page">
    <div class="background-image">
        <img src="{% static 'img/1.jpg' %}" alt="Фон" class="background-image"> <!-- Фоновое изображение -->
    </div>
     <header id="header" class="header d-flex align-items-center sticky-top">
      <div class="container d-flex flex-column align-items-center">
        <h1 class="sitename fade-in">Мой профиль</h1>
        <div class="image-container fade-in"></div>
      </div>
    <a href="{% url 'RecipeHub:main_template' %}" class="back-button">Вернуться назад</a>
    </header>


    <div class="logo-bar">
        <div class="left-section">
          <img src="{% static 'img/logo.png' %}" alt="Логотип">
          <a href="{% url 'RecipeHub:contacts' %}" class="team-contact">Связь с командой</a>
          <a href="https://t.me/yourbot" target="_blank" class="team-contact">Напишите нам в Telegram</a>
        </div>
        <div class="social-icons">
          <a href="https://facebook.com" target="_blank">
            <img src="{% static 'img/facebook.svg' %}" alt="Facebook">
          </a>
          <a href="https://instagram.com" target="_blank">
            <img src="{% static 'img/instagram.svg' %}" alt="Instagram">
          </a>
          <a href="https://vk.com" target="_blank">
            <img src="{% static 'img/VK.svg' %}" alt="ВКонтакте">
          </a>
        </div>
    
</body>
