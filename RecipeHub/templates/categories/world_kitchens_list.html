{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta name="description" content="Описание вашего сайта">
  <meta name="keywords" content="ключевые, слова, вашего, сайта">
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lora&display=swap" rel="stylesheet">
  <link href="{% static 'css/menu/categories.css' %}" rel="stylesheet">
  <link href="{% static 'css/menu/style.css' %}" rel="stylesheet">
  <style>
    /* Стили для уменьшения ширины контейнера вокруг заголовка */
    .title-container {
      max-width: 70%; /* Здесь задаем нужную ширину для контейнера с заголовком */
      margin: 0 auto;  /* Центрируем контейнер */
    }

    /* Категории */
    .category-item {
      opacity: 0;
      transform: translateY(30px); /* Сначала элемент будет ниже своего положения */
      animation: slide-up 0.6s ease-out forwards;
    }

    /* Анимация для вылета снизу */
    @keyframes slide-up {
      to {
        opacity: 1;
        transform: translateY(0); /* Элемент возвращается в исходное положение */
      }
    }

    /* Пауза между анимациями для каждого элемента */
    .category-item:nth-child(1) {
      animation-delay: 0.05s;
    }

    .category-item:nth-child(2) {
      animation-delay: 0.25s;
    }

    .category-item:nth-child(3) {
      animation-delay: 0.45s;
    }

    .category-item:nth-child(4) {
      animation-delay: 0.65s;
    }

    .category-item:nth-child(5) {
      animation-delay: 0.85s;
    }

    .category-item:nth-child(6) {
      animation-delay: 1.05s;
    }

    .category-item:nth-child(7) {
      animation-delay: 1.25s;
    }

    .category-item:nth-child(8) {
      animation-delay: 1.45s;
    }

    .category-item:nth-child(9) {
      animation-delay: 1.65s;
    }

    /* Убираем ограничение прокрутки */
    html,
    body {
      height: 100%; /* Растягиваем на всю высоту экрана */
      width: 100%; /* Растягиваем на всю ширину экрана */
      margin: 0; /* Убираем отступы */
      padding: 0; /* Убираем отступы */
      overflow: auto; /* Разрешаем прокрутку */
    }

    /* Все элементы на странице */
    *,
    *::before,
    *::after {
      box-sizing: border-box; /* Применяем border-box ко всему */
    }

    /* Убираем отображение прокрутки в основных контейнерах, но прокрутка сохраняется */
    .category-container,
    .category,
    .pagination,
    .main.main,
    .category-item,
    .category-card-container,
    .container {
      overflow: visible; /* Разрешаем прокрутку, если нужно */
    }

    /* Пагинация */
.pagination {
  display: flex;
  justify-content: center;
  margin-top: 30px;
  margin-bottom: 50px;
  width: 100%;
}

.pagination a {
  padding: 10px 20px;
  margin: 0 5px;
  background-color: #007bff;
  color: white;
  font-size: 1.2rem;
  border-radius: 5px;
  text-decoration: none;
  transition: background-color 0.3s;
}

.pagination a:hover {
  background-color: #0056b3;
}

.pagination .current {
  text-align: center;
  font-size: 1.2rem;
  color: black;
}

.pagination a:disabled {
  background-color: #ccc;
  cursor: not-allowed;
}

/* Логотип */
.logo-bar img {
  width: 70px;  /* Устанавливаем фиксированную ширину */
  height: 70px; /* Устанавливаем фиксированную высоту */
  object-fit: contain; /* Обеспечивает правильное соотношение сторон изображения */
  transition: transform 0.3s ease-in-out; /* Оставляем только трансформацию */
  background: transparent; /* Убираем фоновое изображение */
  display: block; /* Убираем нежелательные отступы вокруг картинки */
}

/* Убедитесь, что логотип не изменяет размеры после появления */
.logo-bar {
  background: rgba(255, 255, 255, 0.9); /* Полупрозрачный фон */
  padding: 20px 0;
  position: relative;
  bottom: 0; /* Привязываем к низу */
  left: 0;
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-left: 20px;
  padding-right: 50px;
  box-shadow: 0 -1px 5px rgba(0, 0, 0, 0.1); /* Тень */
  z-index: 10;
  margin-top: auto;
}

/* Убедитесь, что логотип не изменяет размеры из-за изменений в родителе */
.logo-bar .left-section {
  display: flex;
  align-items: center;
  gap: 35px;
}




.logo-bar .left-section {
  display: flex;
  align-items: center;
  gap: 35px;
}

.logo-bar img {
  width: 70px;
  height: auto;
  transition: transform 0.3s ease-in-out;
}

.logo-bar .team-contact {
  font-size: 1.3rem;
  color: #808080;
  text-decoration: none;
  transition: color 0.3s ease;
}

.logo-bar .team-contact:hover {
  color: #333;
}

/* Иконки социальных сетей */
.social-icons {
  display: flex;
  gap: 35px;
  /* Устанавливаем расстояние между иконками */
  align-items: center;
}

.social-icons a {
  display: inline-block;
}

.social-icons img {
  width: 30px;
  /* Размер иконок */
  height: auto;
  transition: transform 0.3s ease-in-out, filter 0.3s ease;
  cursor: pointer;
}

.social-icons img:hover {
  transform: scale(1.2);
  filter: brightness(1.2);
}

  </style>
</head>

<body class="index-page background-image">
  <div class="background-image">
    <img src="{% static 'img/1.jpg' %}" alt="Фон" class="background-image"> <!-- Фоновое изображение -->
  </div>
  <a href="{% url 'RecipeHub:categories' %}" class="back-button">Вернуться назад</a>

  <main class="main">
    <section id="categories" class="categories">
      <div class="container">
        <!-- Контейнер для заголовка с уменьшенной шириной -->
        <div class="title-container">
          <h1 class="title">Кухни мира</h1>
        </div>
        <div class="row justify-content-center">
          {% for cuisine in cuisines %}
          <div class="category-item text-center">
            <div class="category-card-container">
              <h3>{{ cuisine.name }}</h3>
              <p>{{ cuisine.description }}</p>
              <a href="{% url 'RecipeHub:cuisine_detail' cuisine.pk %}" class="btn btn-red">Посмотреть</a>
            </div>
          </div>
          {% endfor %}
        </div>
      </div>
    </section>
  </main>

  {% block pagination %}
        {% include "pagination/coisine_pagination.html" %}
    {% endblock %}

    <div class="logo-bar">
      <div class="left-section">
        <img src="{% static 'img/logo.png' %}" alt="Логотип">
        <a href="{% url 'RecipeHub:contacts' %}" class="team-contact">Связь с командой</a>
        <a href="https://t.me/yourbot" target="_blank" class="team-contact">Напишите нам в Telegram</a>
      </div>
      <div class="social-icons">
        <a href="https://facebook.com" target="_blank">
          <img src="{% static 'img/facebook.svg' %}" alt="Facebook">
        </a>
        <a href="https://instagram.com" target="_blank">
          <img src="{% static 'img/instagram.svg' %}" alt="Instagram">
        </a>
        <a href="https://vk.com" target="_blank">
          <img src="{% static 'img/VK.svg' %}" alt="ВКонтакте">
        </a>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>

</html>
