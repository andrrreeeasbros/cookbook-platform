{% load static %}
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta name="description" content="Описание вашего сайта" />
    <meta name="keywords" content="ключевые, слова, вашего, сайта" />
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Lora&display=swap" rel="stylesheet" />
    <link href="{% static 'css/menu/recipes.css' %}" rel="stylesheet" />
    <link href="{% static 'css/menu/style.css' %}" rel="stylesheet" />
  </head>
  <style></style>

  <body class="index-page">
    <div class="background-image">
      <img src="{% static 'img/1.jpg' %}" alt="Фон" class="background-image" />
    </div>
    <a href="{% url 'RecipeHub:categories' %}" class="back-button">Вернуться назад</a>
    <main class="main">
      {% block content %}{% endblock  %}

      <div class="pagination">
        <span class="step-links">
          {% if recipes.has_previous %}
            <a href="?page={{ recipes.previous_page_number }}">&laquo; Первая страница</a>
            <a href="?page={{ recipes.previous_page_number }}">Предыдущая страница</a>
          {% endif %}
          <span class="current"></span>
          {% if recipes.has_next %}
            <a href="?page={{ recipes.next_page_number }}">Следующая страница</a>
            <a href="?page={{ recipes.paginator.num_pages }}">Последняя страница &raquo;</a>
          {% endif %}
        </span>
      </div>


      <div class="modal fade" id="recipeModal" tabindex="-1" role="dialog" aria-labelledby="recipeModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="recipeModalLabel">Рецепт</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Закрыть"><span aria-hidden="true">&times;</span></button>
            </div>
            <div class="modal-body" id="recipeContent"></div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-dismiss="modal">Закрыть</button>
            </div>
          </div>
        </div>
      </div>

      <div class="logo-bar">
        <div class="left-section">
          <img src="{% static 'img/logo.png' %}" alt="Логотип" />
          <a href="{% url 'RecipeHub:contacts' %}" class="team-contact">Связь с командой</a>
          <a href="https://t.me/yourbot" target="_blank" class="team-contact">Напишите нам в Telegram</a>
        </div>
        <div class="social-icons">
          <a href="https://facebook.com" target="_blank"><img src="{% static 'img/facebook.svg' %}" alt="Facebook" /></a>
          <a href="https://instagram.com" target="_blank"><img src="{% static 'img/instagram.svg' %}" alt="Instagram" /></a>
          <a href="https://vk.com" target="_blank"><img src="{% static 'img/VK.svg' %}" alt="ВКонтакте" /></a>
        </div>
      </div>
    </main>


    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
      // Обработчик для отправки формы добавления рецепта через AJAX
      $('#addRecipeForm').on('submit', function(event) {
        event.preventDefault(); // Отменяем стандартную отправку формы
  
        const form = $(this); // Получаем форму
        $('#form-errors').html('');  // Очищаем место для ошибок
  
        // Отправляем данные формы на сервер с использованием AJAX
        $.ajax({
          type: "POST",
          url: "{% url 'RecipeHub:add_recipe' %}",  // Путь к представлению для добавления рецепта
          data: form.serialize(),  // Сериализуем данные формы
          success: function(response) {
            if (response.success) {
              alert(response.message);  // Показываем сообщение об успехе
              $('#addRecipeModal').modal('hide');  // Закрываем модальное окно
              location.reload();  // Перезагружаем страницу для отображения нового рецепта
            } else {
              alert('Ошибка при добавлении рецепта.');
            }
          },
          error: function(response) {
            // Если ошибка при добавлении, отображаем ошибки формы
            const errors = response.responseJSON.errors;
            let errorMessages = '<ul>';
            for (let field in errors) {
              errors[field].forEach(function(error) {
                errorMessages += `<li>${error}</li>`;
              });
            }
            errorMessages += '</ul>';
            $('#form-errors').html(errorMessages);  // Показываем ошибки на странице
          }
        });
      });
  
      // Обработчик для открытия модального окна и загрузки данных рецепта
      $('#recipeModal').on('show.bs.modal', function (event) {
        const button = $(event.relatedTarget);
        const recipeName = button.data('recipe-name');  // Используем имя рецепта
    
        // Делаем запрос на сервер для получения данных рецепта
        fetch(`/recipe-details/${recipeName}/`)  // Путь к API для получения данных рецепта
          .then(response => {
            if (!response.ok) {
              throw new Error('Ошибка запроса');
            }
            return response.json();
          })
          .then(data => {
            if (data) {
              const recipeContent = document.getElementById('recipeContent');
              
  
              recipeContent.innerHTML = `
                <h1 class="text-center">${data.name}</h1>
                <h5>Уровень сложности: ${data.level}</h5>
  
                <!-- Ингредиенты -->
                <h5>Ингредиенты:</h5>
                <ul>${data.ingredients.map((ingredient, index) => `<li>${index + 1}. ${ingredient}</li>`).join('')}</ul>
  
                <!-- Этапы приготовления -->
                <h5>Этапы приготовления:</h5>
                 <ul>
                 ${data.steps.map((step) => `<li>${step.step_number}. ${step.step_description}</li>`).join('')}
                 </ul>
              `;
            }
          })
          .catch(error => alert('Ошибка при загрузке данных рецепта'));
      });
    </script>
  </body>
</html>
